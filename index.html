 const R=[[/^http:\/\//,25,"HTTP, no encryption","بدون تشفير HTTP"],[/\d{1,3}(\.\d{1,3}){3}/,30,"IP address instead of a domain","عنوان IP بدل اسم نطاق"],[/@/,25,"Contains @ to hide the real host","يحتوي @ لإخفاء الوجهة"],[/(login|verify|secure|account|update|gift|free|bank|wallet|otp)/,18,"Urgent or credential keywords","كلمات استعجال أو بيانات دخول"],[/-.*-/,12,"Many hyphens in the domain","شرطات كثيرة في النطاق"],[/(bit\.ly|tinyurl|t\.co|cutt\.ly)/,20,"URL shortener hides the target","رابط مختصر يخفي الوجهة"],[/\.(xyz|top|click|zip|work|gq|tk)(\/|$)/,20,"Risky top-level domain","امتداد نطاق عالي الخطورة"],[/(paypa1|g00gle|micr0soft|amaz0n|rajh1|alinma-)/,35,"Look-alike brand spelling","تقليد لاسم علامة معروفة"],[/xn--/,20,"Punycode (lookalike characters)","أحرف مموهة Punycode"]];
 R.forEach(r=>{if(r[0].test(v)){s+=r[1];why.push(L==="ar"?r[3]:r[2])}});
 s=Math.min(s,100);const bad=s>=40;
 $("#scan").className="scan"+(bad?" bad":" ok");$("#mt").style.width=Math.max(s,6)+"%";
 const lbl=s>=60?t.danger:s>=30?t.warn:t.safe;
 $("#vd").innerHTML=`<b>${lbl} · ${t.rep} ${s}/100</b><br>${why.length?why.map(w=>"• "+w).join("<br>"):t.noflag}`;
}
$("#go").onclick=scan;$("#u").addEventListener("keydown",e=>{if(e.key==="Enter")scan()});
$("#lang").onclick=()=>{L=L==="ar"?"en":"ar";localStorageSet("lang",L);cI=0;del=false;render()};
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
render();tick();
</script>
